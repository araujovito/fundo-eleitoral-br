[project]
name = "fundo-eleitoral-br"
version = "0.1.0"
description = "Alocacao do Fundo Eleitoral e do Fundo Partidario pelos partidos brasileiros"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "curl_cffi>=0.7",
    "huggingface-hub>=0.25",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundo_eleitoral"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
